<style>
  html, body { margin:0; padding:0; height:100%; background:#F4F1F0; overflow:hidden;
    font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  #bingkai { display:block; width:100%; height:100%; border:0; }
  #tunggu { position:fixed; inset:0; display:grid; place-items:center; background:#F4F1F0; z-index:2;
    transition:opacity .35s ease; }
  #tunggu.pergi { opacity:0; pointer-events:none; }
  #tunggu .isi { text-align:center; padding:24px; }
  #tunggu img { height:30px; width:auto; display:block; margin:0 auto 20px; }
  #tunggu .bar { width:190px; height:3px; background:#E6DFDE; border-radius:2px; overflow:hidden; margin:0 auto; }
  #tunggu .bar i { display:block; height:100%; width:40%; background:#C81E2D; border-radius:2px;
    animation:geser 1.1s ease-in-out infinite; }
  @keyframes geser { 0% { transform:translateX(-110%); } 100% { transform:translateX(360%); } }
  #tunggu p { font-size:13px; color:#6B6164; margin:18px 0 0; }
  #galat { display:none; max-width:420px; margin:0 auto; text-align:left; background:#fff; border-radius:16px;
    padding:20px; box-shadow:0 14px 34px -22px rgba(30,10,14,.3); }
  #galat b { display:block; font-size:15px; margin-bottom:8px; }
  #galat p { font-size:13px; line-height:1.6; color:#6B6164; margin:0 0 14px; }
  #galat a { display:inline-block; background:#C81E2D; color:#fff; text-decoration:none; border-radius:11px;
    padding:11px 18px; font-size:13px; font-weight:600; }
</style>
